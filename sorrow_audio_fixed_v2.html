<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Sorrow.wtf | collective</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Roboto:wght@100;300&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #050505;
            --accent: #444; 
            --text: #e0e0e0;
            --border: 1px solid rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Roboto', sans-serif;
            font-weight: 300; 
            overflow-x: hidden;
            margin: 0;
            min-height: 100vh;
            user-select: none;
            position: relative;
        }

        .bg-container {
            position: fixed;
            inset: -8%;
            z-index: -2;
            overflow: hidden;
            will-change: transform;
        }

        .bg-image {
            width: 116%;
            height: 116%;
            background-image: url('https://files.catbox.moe/wdfm00.webp');
            background-size: cover;
            background-position: center right;
            filter: brightness(0.55) contrast(1.15);
            animation: ambientBreathe 18s ease-in-out infinite alternate, colorPulse 12s ease-in-out infinite alternate;
            transform-origin: center center;
            will-change: transform, filter;
            transform: translateZ(0);
        }

        .bg-particles {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            opacity: 0.65;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(5,5,5,0.2) 0%, rgba(5,5,5,0.88) 100%);
            z-index: -1;
            pointer-events: none;
        }

        @keyframes ambientBreathe {
            0% { transform: scale(1) translate3d(0, 0, 0) rotate(0deg); }
            33% { transform: scale(1.04) translate3d(-10px, -8px, 0) rotate(0.2deg); }
            66% { transform: scale(1.02) translate3d(8px, -4px, 0) rotate(-0.2deg); }
            100% { transform: scale(1.05) translate3d(5px, 8px, 0) rotate(0.1deg); }
        }

        
        @keyframes colorPulse {
            0% { opacity: 0.92; }
            50% { opacity: 1; }
            100% { opacity: 0.88; }
        }

        #intro-screen {
            position: fixed;
            inset: 0;
            background-color: var(--bg);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
            cursor: pointer;
            will-change: opacity, visibility;
        }

        #intro-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .intro-title {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            letter-spacing: 0.5em;
            opacity: 0.9;
            text-transform: lowercase;
        }

        .card-container {
            position: relative;
            max-width: 800px;
            width: 95%;
            min-height: 480px;
        }

        .card {
            position: relative;
            width: 100%;
            background: rgba(8, 8, 8, 0.92);
            border: var(--border);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            flex-direction: row;
            opacity: 1;
            transform: translateZ(0);
            transition: opacity 0.25s ease-in-out, transform 0.25s ease-in-out;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            will-change: opacity, transform;
        }

        .card.transitioning {
            opacity: 0;
            transform: translateY(6px) scale(0.99);
        }

        .profile-img-container {
            width: 320px;
            height: 480px;
            overflow: hidden;
            border-right: var(--border);
            flex-shrink: 0;
            background: #0d0d0d;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-img {
            filter: grayscale(1) contrast(1.1) brightness(0.8);
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease;
            will-change: opacity;
        }

        .radio-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 1.25rem;
            margin-top: auto;
        }

        .radio-progress-bg {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.05); 
            margin-top: 10px;
            cursor: pointer;
            position: relative;
        }

        .radio-progress-fill {
            height: 100%;
            background: #666; 
            width: 0%;
            position: relative;
        }

        .radio-progress-fill::after {
            content: '';
            position: absolute;
            right: -2px;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        .volume-slider {
            -webkit-appearance: none;
            height: 1px;
            background: rgba(255, 255, 255, 0.1); 
            outline: none;
            opacity: 0.5;
            transition: 0.3s;
        }

        .volume-slider:hover { opacity: 0.8; }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 3px; 
            height: 3px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
        }

        .member-btn {
            opacity: 0.7;
            transition: all 0.25s ease;
            cursor: pointer;
            text-transform: capitalize;
            font-weight: 300;
        }

        .member-btn:hover {
            opacity: 1;
        }

        .member-btn.active {
            opacity: 1;
            text-shadow: 0 0 12px rgba(255,255,255,0.4);
            font-weight: 400;
        }

        .nav-link {
            transition: all 0.3s ease;
        }
        .nav-link:hover {
            text-decoration: line-through;
            opacity: 1 !important;
        }

        @media (max-width: 640px) {
            .card { flex-direction: column; }
            .profile-img-container { width: 100%; height: 350px; border-right: none; border-bottom: var(--border); }
        }
    </style>
</head>
<body class="flex flex-col items-center">

    
    <div class="bg-container" id="bg-container">
        <div class="bg-image" id="bg-image"></div>
    </div>
    <canvas id="particle-canvas" class="bg-particles"></canvas>
    <div class="bg-overlay"></div>

    <audio id="bg-music" preload="auto"></audio>

    <div id="intro-screen" onclick="enterSite()">
        <div class="intro-title">Sorrow.wtf</div>
        <div class="intro-prompt opacity-85 text-[10px] mt-4 tracking-[0.5em] uppercase font-light">click to enter</div>
    </div>

    <header class="nav-header z-10 text-center py-12">
        <h1 class="font-['Cinzel'] text-4xl mb-2 tracking-widest lowercase opacity-95">Sorrow.wtf</h1>
        <div class="flex gap-4 justify-center items-center">
            <a href="https://t.me/sorrow_sh" target="_blank" rel="noopener noreferrer" class="text-[10px] tracking-[0.4em] uppercase opacity-80 hover:opacity-100 transition-opacity hover:line-through">telegram</a>
            <span class="opacity-40 text-[10px]">•</span>
            <a href="https://doxbin.com/user/Sorrowed" target="_blank" rel="noopener noreferrer" class="text-[10px] tracking-[0.4em] uppercase opacity-80 hover:opacity-100 transition-opacity hover:line-through">doxbin</a>
        </div>
        
        <div class="flex gap-10 justify-center mt-10 text-[13px] tracking-[0.4em]">
            <div id="btn-Bipolar" class="member-btn active" onclick="showProfile('Bipolar')">Bipolar</div>
            <div id="btn-Worry" class="member-btn" onclick="showProfile('Worry')">Worry</div>
            <div id="btn-Remy" class="member-btn" onclick="showProfile('Remy')">Remy</div>
        </div>
    </header>

    <main class="z-10 w-full flex justify-center px-4 mb-20">
        <div class="card-container">
            <div id="profile-card" class="card">
                <div class="profile-img-container">
                    <img id="p-img" src="" alt="profile" class="profile-img" onerror="imgFallback(this)">
                </div>
                <div class="p-10 flex flex-col flex-grow">
                    <div class="mb-auto">
                        <h2 id="p-name" class="font-['Cinzel'] text-3xl mb-1 capitalize"></h2>
                        <p id="p-role" class="text-[10px] opacity-85 tracking-[0.4em] uppercase mb-8 font-medium"></p>
                        
                        <div class="space-y-6">
                            <div>
                                <div class="text-[10px] uppercase opacity-85 tracking-[0.2em] mb-3 font-medium">social</div>
                                <div id="p-links" class="flex flex-wrap gap-x-6 gap-y-2"></div>
                            </div>
                            <div>
                                <div class="text-[10px] uppercase opacity-85 tracking-[0.2em] mb-3 font-medium">group affiliations</div>
                                <div id="p-groups" class="text-[12px] space-y-2 opacity-95 leading-relaxed font-normal"></div>
                            </div>
                        </div>
                    </div>

                    <div class="radio-box">
                        <div class="flex justify-between items-center text-[10px] opacity-90 lowercase tracking-[0.15em] mb-1">
                            <span id="p-song-info" class="font-normal truncate max-w-[240px]">...</span>
                            <div class="flex items-center gap-2">
                                <span id="current-time">0:00</span> / <span id="duration-time">0:00</span>
                            </div>
                        </div>
                        <div class="radio-progress-bg" onclick="seek(event)">
                            <div id="progress-fill" class="radio-progress-fill"></div>
                        </div>
                        
                        <div class="flex items-center justify-between mt-5">
                            <div class="flex items-center gap-6">
                                <button onclick="rotate(-1)" class="opacity-80 hover:opacity-100 transition-opacity" aria-label="Previous track">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                                </button>
                                <button onclick="toggleMusic()" id="play-btn" class="opacity-95 hover:opacity-100 scale-110" aria-label="Play or pause">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                                </button>
                                <button onclick="rotate(1)" class="opacity-80 hover:opacity-100 transition-opacity" aria-label="Next track">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                                </button>
                            </div>
                            <div class="flex items-center gap-3">
                                <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" class="opacity-80"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                                <input type="range" class="volume-slider w-14" min="0" max="1" step="0.01" value="0.5" oninput="setVolume(this.value)">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="fixed bottom-8 right-8 z-10 opacity-80 text-[9px] tracking-[0.5em] uppercase font-light">
        &copy; Sorrow.wtf // collective
    </footer>

    <script>
        const player = document.getElementById('bg-music');
        const fill = document.getElementById('progress-fill');
        const time_cur = document.getElementById('current-time');
        const time_dur = document.getElementById('duration-time');
        
        let active = 'Bipolar';
        let playlist = [];
        let index = 0;
        let isTransitioning = false;

        const profiles = {
            'Bipolar': {
                name: 'Bipolar',
                role: 'Founder',
                image: 'https://files.catbox.moe/bhqoe4.jpg', 
                groups: [
                    { name: 'sorrow', role: 'Founder' }
                ],
                links: [
                    { label: 'Telegram', url: 'https://t.me/xvzvcz' }
                ],
                songs: [
                    { title: "Look At What I Started", url: "Bipolar songs/look at what i started.mp3" },
                    { title: "Nothing Makes Me Happy (2023)", url: "Bipolar songs/nothing makes me happy , and women make me cry (2023).mp3" },
                    { title: "Witchbox - Rotting In My Body", url: "Bipolar songs/witchbox - Rotting In My Body (ft. wifiskeleton).mp3" },
                    { title: "Its Pointless If U Rlly Think About It", url: "Bipolar songs/its pointless if u rlly think about it.mp3" }
                ]
            },
            'Worry': {
                name: 'Worry',
                role: 'Founder',
                image: 'https://files.catbox.moe/e66ooy.jpg',
                groups: [
                    { name: 'sorrow', role: 'Founder' }
                ],
                links: [
                    { label: 'Telegram', url: 'https://t.me/sorrow_sh' }
                ],
                songs: [
                    { title: "Whispers in the Dark", url: "Worry songs/Whispers in the Dark.mp3" }
                ]
            },
            'Remy': {
                name: 'Remy',
                role: 'Founder',
                image: 'https://files.catbox.moe/pctsmk.jpg',
                groups: [
                    { name: 'sorrow', role: 'Founder' }
                ],
                links: [
                    { label: 'Telegram', url: 'https://t.me/rancs' }
                ],
                songs: [
                    { title: "Highway to Hell", url: "Remys songs/ACDC - Highway to Hell (Official Video).mp3" },
                    { title: "Ivri - Tower of Memories", url: "Remys songs/ivri - tower of memories (Music Video).mp3" },
                    { title: "Smells Like Teen Spirit", url: "Remys songs/Nirvana - Smells Like Teen Spirit (Official Music Video).mp3" }
                ]
            }
        };

        function preloadImages() {
            Object.values(profiles).forEach(p => {
                if (p.image) {
                    const img = new Image();
                    img.src = p.image;
                }
            });
        }

        function formatSongTitle(trackItem) {
            if (!trackItem) return 'No Track Loaded';
            if (typeof trackItem === 'object' && trackItem.title) return trackItem.title;
            let name = String(trackItem).split('/').pop().split('\\').pop();
            name = decodeURIComponent(name).replace(/\.[^/.]+$/, "");
            name = name.replace(/[_-]/g, ' ');
            return name.replace(/\b\w/g, char => char.toUpperCase());
        }

        function imgFallback(img) {
            img.src = 'https://images.unsplash.com/photo-1557683316-973673baf926?auto=format&fit=crop&q=80&w=400';
            img.style.opacity = '0.4';
        }

        function enterSite() {
            document.getElementById('intro-screen').classList.add('hidden');
            render();
            load();
            playAudio();
        }

        function playAudio() {
            if (!player.src) return;
            player.play().then(() => {
                updateUI(true);
            }).catch((err) => {
                console.warn('Audio playback prevented or missing media stream:', err);
                updateUI(false);
            });
        }

        function load() {
            const data = profiles[active];
            if (!data) return;
            
            playlist = data.songs || [];
            if (index >= playlist.length) index = 0;
            
            if (playlist.length > 0) {
                const track = playlist[index];
                const trackUrl = typeof track === 'object' ? track.url : track;
                player.src = trackUrl;
                player.load();
                document.getElementById('p-song-info').innerText = formatSongTitle(track);
            } else {
                player.src = '';
                document.getElementById('p-song-info').innerText = 'No tracks available';
            }

            time_dur.innerText = "0:00";
            time_cur.innerText = "0:00";
            fill.style.width = "0%";
        }

        function render() {
            const data = profiles[active];
            if (!data) return;

            const img = document.getElementById('p-img');
            
            document.getElementById('p-name').innerText = data.name;
            document.getElementById('p-role').innerText = data.role;
            img.src = data.image;
            img.style.opacity = '1';
            
            const g_wrap = document.getElementById('p-groups');
            g_wrap.innerHTML = data.groups.map(g => 
                `<p class="capitalize">${g.name} <span class="opacity-40 mx-2">/</span> <span class="opacity-80">${g.role}</span></p>`
            ).join('');

            const l_wrap = document.getElementById('p-links');
            l_wrap.innerHTML = data.links.map(l => {
                if (l.restricted) return `<span class="text-[11px] italic opacity-60">${l.label}</span>`;
                return `<a href="${l.url}" target="_blank" rel="noopener noreferrer" class="nav-link text-[11px] opacity-80 lowercase">${l.label}</a>`;
            }).join('');

            document.querySelectorAll('.member-btn').forEach(btn => {
                btn.classList.toggle('active', btn.id === `btn-${active}`);
            });
        }

        function showProfile(id) {
            if (active === id || !profiles[id] || isTransitioning) return;
            isTransitioning = true;
            active = id;
            index = 0; 
            
            const card = document.getElementById('profile-card');
            card.classList.add('transitioning');
            
            setTimeout(() => {
                render();
                load();
                card.classList.remove('transitioning');
                playAudio();
                isTransitioning = false;
            }, 200);
        }

        function rotate(dir) {
            if (playlist.length === 0) return;
            index += dir;
            if (index < 0) index = playlist.length - 1;
            if (index >= playlist.length) index = 0;
            load();
            playAudio();
        }

        function toggleMusic() {
            if (!player.src) return;

            if (player.paused) {
                playAudio();
            } else {
                player.pause();
                updateUI(false);
            }
        }

        function setVolume(val) {
            const volume = Math.max(0, Math.min(1, Number(val)));
            if (!Number.isNaN(volume)) player.volume = volume;
        }

        function updateUI(playing) {
            const play = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
            const pause = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
            document.getElementById('play-btn').innerHTML = playing ? pause : play;
        }

        function fmt(s) {
            if (isNaN(s) || !isFinite(s)) return "0:00";
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec.toString().padStart(2, '0')}`;
        }

        player.onloadedmetadata = () => {
            time_dur.innerText = fmt(player.duration);
        };

        player.ontimeupdate = () => {
            if (isNaN(player.duration) || player.duration === 0) return;
            fill.style.width = `${(player.currentTime / player.duration) * 100}%`;
            time_cur.innerText = fmt(player.currentTime);
        };

        player.onended = () => rotate(1);

        function seek(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            
            if (!isNaN(player.duration) && player.duration > 0) {
                player.currentTime = pct * player.duration;
            }
        }

        player.volume = 0.5;
        player.preload = 'auto';

        window.addEventListener('DOMContentLoaded', () => {
            preloadImages();
            render();
            load();
            initParticleCanvas();
            initMouseParallax();
        });

        function initParticleCanvas() {
            const canvas = document.getElementById('particle-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let width = (canvas.width = window.innerWidth);
            let height = (canvas.height = window.innerHeight);

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            const particles = Array.from({ length: 35 }, () => ({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 1.5 + 0.5,
                alpha: Math.random() * 0.4 + 0.1,
                speedY: -(Math.random() * 0.25 + 0.08),
                speedX: (Math.random() - 0.5) * 0.2,
                pulse: Math.random() * Math.PI,
                pulseSpeed: Math.random() * 0.015 + 0.005
            }));

            function drawParticles() {
                ctx.clearRect(0, 0, width, height);
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.y += p.speedY;
                    p.x += p.speedX;
                    p.pulse += p.pulseSpeed;

                    if (p.y < -10) {
                        p.y = height + 10;
                        p.x = Math.random() * width;
                    }
                    if (p.x < -10) p.x = width + 10;
                    if (p.x > width + 10) p.x = -10;

                    const currentAlpha = Math.max(0, Math.min(0.6, p.alpha + Math.sin(p.pulse) * 0.15));
                    ctx.fillStyle = `rgba(220, 220, 230, ${currentAlpha})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
                requestAnimationFrame(drawParticles);
            }
            drawParticles();
        }

        function initMouseParallax() {
            const bgContainer = document.getElementById('bg-container');
            if (!bgContainer) return;

            let targetX = 0, targetY = 0;
            let currentX = 0, currentY = 0;

            window.addEventListener('mousemove', (e) => {
                const cx = window.innerWidth / 2;
                const cy = window.innerHeight / 2;
                targetX = (e.clientX - cx) * 0.025;
                targetY = (e.clientY - cy) * 0.025;
            });

            function updateParallax() {
                currentX += (targetX - currentX) * 0.05;
                currentY += (targetY - currentY) * 0.05;
                bgContainer.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
                requestAnimationFrame(updateParallax);
            }
            updateParallax();
        }
    </script>
</body>
</html>
